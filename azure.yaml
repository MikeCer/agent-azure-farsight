name: agent-azure-farsight
state:
  remote:
    backend: AzureBlobStorage
    config:
      accountName: mcerretosatoolssync
      containerName: agent-az-farsight
metadata:
  template: agent-azure-farsight@0.1.0
infra:
  provider: bicep
  path: infra/bicep
hooks:
  preprovision:
    shell: sh
    run: ./scripts/register-resource-providers.sh
services:
  api:
    project: ./src/api
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: false
  admin-web:
    project: ./src/admin-web
    host: containerapp
    language: js
    docker:
      path: Dockerfile
      remoteBuild: false
  agent-tools:
    project: ./src/agent-tools/gateway
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: false
