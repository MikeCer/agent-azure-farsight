name: intune-data-analysis
description: >
  Use when analyzing output from the Intune diagnostics collector
  (intune_diagnostics_tool), Endpoint Analytics evidence, Intune health and
  compliance data, app reliability data, restart/shutdown events, or device
  timeline events. Trigger strongly when the user asks to analyze Intune JSON,
  diagnose a Windows client, check performance/bottlenecks, review health,
  or produce a remediation plan from Intune/Graph evidence. Also use when the
  user says "act as SRE agent" or "why is this device slow/broken".
files:
  - SKILL.md
parameters:
  required: []
  optional:
    - collector_json
    - user_symptom
    - device_name
    - azure_tenant_id
    - azure_client_id
    - azure_client_secret
    - key_vault_url
    - tenant_id_secret_name
    - client_id_secret_name
    - client_secret_secret_name
    - managed_device_id
    - azure_ad_device_id
    - serial_number
    - auth_mode
    - include_pii
    - include_beta_endpoint_analytics
    - max_resolution_pages
    - max_optional_pages
    - tenant_id
    - time_window
defaults:
  auth_mode: auto
  time_window: latest_available_collector_data
tools:
  - intune_diagnostics_tool
