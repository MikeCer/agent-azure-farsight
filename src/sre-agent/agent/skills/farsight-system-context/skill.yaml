name: farsight-system-context
description: >
  Use for FarSight domain reasoning before tool execution: understanding the
  diagnostic module catalog and what each module collects, selecting the right
  module for a given symptom, deciding between Intune-native evidence and
  FarSight endpoint diagnostics, and applying policy/approval boundaries.
  Trigger this skill when the user describes a Windows endpoint problem and
  you need to decide which FarSight module (or Intune path) to use.
files:
  - SKILL.md
parameters:
  required: []
  optional:
    - user_symptom
    - device_name
    - device_id
    - incident_id
    - time_window
    - language
defaults:
  time_window: latest_relevant_window
  language: match_user_language
tools: []
