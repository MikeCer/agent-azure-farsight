name: farsight-diagnostics
description: >
  Use when guiding governed FarSight endpoint diagnostic investigations for the
  Azure SRE Agent. Covers diagnostic job creation, job polling, result summary
  interpretation, artifact metadata review, approved follow-up module execution,
  approval-gated actions, and device investigation history while enforcing
  FarSight safety guardrails.
files:
  - SKILL.md
parameters:
  required: []
  optional:
    - device_identifier
    - device_name
    - tenant_id
    - user_symptom
    - time_window
    - diagnostic_goal
    - module_name
    - module_parameters
    - job_id
    - artifact_id
    - investigation_id
    - approval_context
    - language
    - intune_collector_json
defaults:
  time_window: latest_relevant_window
  language: match_user_language
tools:
  - create_diagnostic_job
  - get_job_status
  - get_job_result_summary
  - retrieve_artifact_metadata
  - request_follow_up_module_execution
  - request_approval_for_action
  - query_device_investigation_history
