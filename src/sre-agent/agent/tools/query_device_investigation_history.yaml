name: query_device_investigation_history
type: PythonFunctionTool
description: Query redacted FarSight investigation history for a device from GET /api/v1/devices/{deviceId}/investigations.
code_file: query_device_investigation_history.py
parameters:
- name: device_id
  type: string
  required: true
  description: FarSight device id.
- name: incident_id
  type: string
  required: false
  description: Optional incident id filter applied to returned history.
- name: max_records
  type: int
  required: false
  description: Maximum records to return, capped at 100. Defaults to 25.
- name: api_base_url
  type: string
  required: false
  description: Optional FarSight API base URL. Defaults to FARSIGHT_API_BASE_URL.
- name: auth_mode
  type: string
  required: false
  description: 'Authentication mode for FarSight API: default, managed-identity, access-token,
    or auto. Defaults to FARSIGHT_AUTH_MODE or default.'
- name: api_scope
  type: string
  required: false
  description: Optional token scope for FarSight API. Defaults to FARSIGHT_API_SCOPE
    or <api_base_url>/.default.
- name: timeout_seconds
  type: int
  required: false
  description: HTTP timeout in seconds, capped at 120. Defaults to 30.
dependencies:
- azure-identity
auth_enabled: true
auth_scopes: []
connector: null
attributes: []
timeout_seconds: 60
tool_mode: Auto
