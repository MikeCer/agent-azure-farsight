name: retrieve_artifact_content
type: PythonFunctionTool
description: >
  Download and return the content of a JSON or plain-text FarSight diagnostic
  artifact for agent analysis. Only JSON and plain-text artifacts are supported
  (content is server-capped at 256 KB). Do NOT use this tool for ZIP artifacts
  (for example Get-AppLogBundle output) — it will fail on them. For ZIP
  artifacts, use download_artifact_file followed by extract_zip_artifact_entry
  instead. Use this tool only after retrieve_artifact_metadata confirms the
  artifact is JSON or text (for example a service snapshot JSON, config
  evidence, or event log slice). If the artifact exceeds 256 KB, use
  request_follow_up_module_execution to produce a smaller evidence slice.
code_file: retrieve_artifact_content.py
parameters:
  - name: job_id
    type: string
    required: true
    description: FarSight job id that produced the artifact.
  - name: artifact_id
    type: string
    required: true
    description: Artifact id from retrieve_artifact_metadata output.
  - name: api_base_url
    type: string
    required: false
    description: Optional AGT gateway base URL. Defaults to SRE_AGENT_TOOL_ENDPOINT_URL.
  - name: auth_mode
    type: string
    required: false
    description: Authentication mode for the AGT gateway. Defaults to default (managed identity).
  - name: api_scope
    type: string
    required: false
    description: Optional token scope. Defaults to SRE_AGENT_TOOL_ENDPOINT_SCOPE.
  - name: timeout_seconds
    type: int
    required: false
    description: HTTP timeout in seconds, capped at 120. Defaults to 30.
dependencies:
  - azure-identity
auth_enabled: true
auth_scopes: []
connector: null
attributes: []
timeout_seconds: 60
tool_mode: Auto
