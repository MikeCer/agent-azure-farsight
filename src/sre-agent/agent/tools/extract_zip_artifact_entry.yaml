name: extract_zip_artifact_entry
type: PythonFunctionTool
description: >
  List files inside a ZIP that has already been downloaded into the SRE Agent
  workspace, or extract a specific file from it into a local output directory.
  Use this tool when a FarSight diagnostic module (e.g., Get-AppLogBundle)
  produces a ZIP archive and you want to inspect one named file locally without
  sending the whole archive through the gateway.
code_file: extract_zip_artifact_entry.py
parameters:
  - name: zip_path
    type: string
    required: true
    description: Local filesystem path to the ZIP file in the SRE Agent workspace.
  - name: entry_path
    type: string
    required: false
    description: >
      Path of the file to extract from the ZIP. If omitted, returns a listing
      of all files in the archive with their paths and sizes. Use the exact path
      value from the listing to extract a specific file.
  - name: output_dir
    type: string
    required: false
    description: Optional local directory where extracted files should be written. Defaults to a sibling folder next to the ZIP.
dependencies: []
auth_enabled: false
auth_scopes: []
connector: null
attributes: []
timeout_seconds: 30
tool_mode: Auto
